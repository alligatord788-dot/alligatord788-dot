<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.48" stop-color="#06131f"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="430" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="22" fill="url(#grid)" opacity="0.55"/>
  <rect x="24" y="22" width="1152" height="386" rx="18" stroke="#1f3b52" stroke-width="2"/>

  <g opacity="0.22">
    <circle cx="145" cy="88" r="150" fill="#0ea5e9"/>
    <circle cx="1010" cy="330" r="190" fill="#22c55e"/>
  </g>

  <g filter="url(#glow)">
    <path d="M155 306 C250 210, 314 278, 405 169 C514 39, 612 220, 708 118 C805 15, 882 229, 1018 120" stroke="url(#cyan)" stroke-width="3" opacity="0.9">
      <animate attributeName="stroke-dasharray" values="0 1200;220 1200;0 1200" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M155 332 C284 298, 362 353, 458 260 C557 164, 668 307, 774 225 C885 139, 958 287, 1058 220" stroke="#38bdf8" stroke-width="2" opacity="0.55">
      <animate attributeName="stroke-dasharray" values="0 1200;180 1200;0 1200" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <g filter="url(#glow)">
    <circle cx="220" cy="235" r="7" fill="#22d3ee">
      <animate attributeName="r" values="5;10;5" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="405" cy="169" r="7" fill="#22c55e">
      <animate attributeName="r" values="5;10;5" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="708" cy="118" r="7" fill="#22d3ee">
      <animate attributeName="r" values="5;10;5" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1018" cy="120" r="7" fill="#22c55e">
      <animate attributeName="r" values="5;10;5" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(92 72)">
    <text x="0" y="0" fill="#67e8f9" font-family="Consolas, JetBrains Mono, monospace" font-size="20">system.boot()</text>
    <text x="0" y="48" fill="#e5f9ff" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="62">ABHIJIT DAS</text>
    <text x="2" y="90" fill="#93c5fd" font-family="Consolas, JetBrains Mono, monospace" font-size="22">AI/ML Engineer in progress | Data Science | GenAI | Analytics</text>
    <text x="2" y="142" fill="#cbd5e1" font-family="Consolas, JetBrains Mono, monospace" font-size="18">raw_data -> features -> models -> explanations -> useful products</text>
  </g>

  <g transform="translate(790 76)">
    <rect x="0" y="0" width="300" height="178" rx="14" fill="#020617" stroke="#164e63"/>
    <text x="24" y="38" fill="#22d3ee" font-family="Consolas, JetBrains Mono, monospace" font-size="18">active_modules</text>
    <text x="24" y="78" fill="#e5e7eb" font-family="Consolas, JetBrains Mono, monospace" font-size="16">[01] machine_learning</text>
    <text x="24" y="108" fill="#e5e7eb" font-family="Consolas, JetBrains Mono, monospace" font-size="16">[02] rag_agents</text>
    <text x="24" y="138" fill="#e5e7eb" font-family="Consolas, JetBrains Mono, monospace" font-size="16">[03] dashboards</text>
  </g>

  <rect x="-170" y="0" width="160" height="430" fill="#22d3ee" opacity="0.16">
    <animate attributeName="x" values="-170;1210" dur="4.8s" repeatCount="indefinite"/>
  </rect>
  <line x1="0" y1="392" x2="1200" y2="392" stroke="#22d3ee" stroke-width="2" opacity="0.65">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2s" repeatCount="indefinite"/>
  </line>
</svg>
